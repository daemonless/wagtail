name: wagtail

x-daemonless:
  title: "Wagtail"
  icon: ":material-apps:"  # https://pictogrammers.com/library/mdi/ (material-) or https://simpleicons.org/ (simple-)
  category: "Productivity"
  description: "Wagtail is an open source content management system built on Django, with a strong community and commercial support. It's focused on user experience, and offers precise control for designers and developers."
  upstream_url: "https://github.com/wagtail/wagtail"
  web_url: "https://wagtail.org/"
  freshports_url: "https://www.freshports.org/www/py-wagtail/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"
  appjail: true

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      DATABASE_URL:
        desc: "Use Postgres instead of the default SQLite, e.g. postgres://user:pass@host:5432/db. Unset = SQLite in /config."
        default: ""
      SECRET_KEY:
        desc: "Django SECRET_KEY. Auto-generated and persisted to /config/.secret_key if unset."
        default: ""
      WAGTAIL_ALLOWED_HOSTS:
        desc: "Comma-separated Django ALLOWED_HOSTS."
        default: "*"
      WAGTAIL_SUPERUSER_NAME:
        desc: "If set with WAGTAIL_SUPERUSER_PASSWORD, creates an admin superuser on start."
        default: ""
      WAGTAIL_SUPERUSER_PASSWORD:
        desc: "Password for the admin superuser (with WAGTAIL_SUPERUSER_NAME)."
        default: ""
      WAGTAIL_WORKERS:
        desc: "Number of gunicorn workers."
        default: "3"
    volumes:
      /config: "Holds the generated Wagtail project (/config/app), SQLite DB, media, and the secret key. Must be persistent."
    ports:
      8080: "Web UI / admin (/admin)"

services:
  wagtail:
    image: ghcr.io/daemonless/wagtail:latest
    container_name: wagtail
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # First-run admin login (optional):
      - WAGTAIL_SUPERUSER_NAME=admin
      - WAGTAIL_SUPERUSER_PASSWORD=changeme
      # Postgres instead of SQLite (optional):
      # - DATABASE_URL=postgres://wagtail:wagtail@postgres:5432/wagtail

    volumes:
      - /path/to/containers/wagtail:/config

    ports:
      - 8080:8080
